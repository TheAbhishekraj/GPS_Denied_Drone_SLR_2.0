name: Reproducibility Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run end-to-end reproducibility pipeline
      run: |
        python run_all.py

    - name: Verify outputs generated
      run: |
        test -f data/processed/database_final_231.csv
        test -f analysis/output/report.md
        test -f references/bibliography.txt
        echo "✅ All expected files verified."

    - name: Upload analysis artifacts
      uses: actions/upload-artifact@v4
      with:
        name: slr-artifacts
        path: |
          analysis/output/
          references/
          data/processed/
